[workspace]
[package]
name = "review_mock_amm"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "associated_token"] }
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
