name: Independent Linux source-to-mainnet verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Compile pinned source and compare finalized mainnet
        run: node scripts/verify-linux.mjs
      - name: Retain public build and comparison evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-mainnet-verification-evidence
          path: |
            verification/LINUX-MAINNET-RESULT.json
            verification/candidate/LINUX-CI-RESULT.json
            verification/candidate/linux-build.log
          if-no-files-found: error
