name: Independent Windows source-to-mainnet verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.20.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Compile pinned public source and compare finalized mainnet
        shell: pwsh
        run: |
          $env:DUSD_VERIFY_WORK = $env:RUNNER_TEMP
          node scripts/verify-windows.mjs
      - name: Retain only non-secret verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-verification-evidence
          path: |
            ${{ runner.temp }}/dusd-verify-*/RESULT.json
            ${{ runner.temp }}/dusd-verify-*/build.log
          if-no-files-found: error
